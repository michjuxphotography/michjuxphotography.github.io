<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#04060d">

    <title>Produkty</title>
    <script>document.documentElement.classList.add('js')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="prod">
    <div class="curtain" aria-hidden="true"><span>PRODUKTY</span></div>
    <!-- Tło WebGL reagujące na mysz i dotyk -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <nav>
        <div class="logo">
            <h4><a href="index.html">MICHJUX PHOTOGRAPHY</a></h4>
        </div>
        <ul class="nav-links">
            <li><a class="active" href="index.html" data-magnetic>Portfolio</a></li>
            <li><a href="cennik.html" data-magnetic>Cennik</a></li>
        </ul>
        <button class="burger" type="button" aria-label="Menu" aria-expanded="false">
            <span></span>
            <span></span>
        </button>
    </nav>

    <header class="page-header">
        <p class="kicker" data-reveal><span class="dot"></span>Portfolio <b>/</b> ujęcia: <span data-photo-count>08</span></p>
        <h1 class="page-title"><span class="glitch grad-text" data-text="Produkty" data-scramble>Produkty</span></h1>
        <p class="lead" data-reveal style="--i: 2">Detale, które mówią same za siebie. Profesjonalna fotografia produktowa, podkreślająca design i jakość.</p>
        <a class="scroll-hint" href="#galeria" aria-label="Przewiń do galerii" data-reveal style="--i: 4"><span></span></a>
    </header>

    <div class="divider" data-reveal aria-hidden="true">
        <span>Galeria</span>
    </div>

    <main class="img-gallery" id="galeria" data-folder="produkty">
        <!-- ZDJĘCIA ŁADUJĄ SIĘ AUTOMATYCZNIE PRZEZ SKRYPT -->
    </main>

    <!-- Zdjęcia: wrzuć do images/produkty/ – lista generuje się sama (GitHub Actions / lokalny serwer) -->

    <div class="lightbox" id="fullImgBox" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia" aria-hidden="true">
        <div class="lb-stage">
            <div class="lb-frame"><img id="fullImg" alt=""></div>
        </div>
        <div class="lb-counter"><span class="lb-cur">01</span> / <span class="lb-total">01</span></div>
        <button class="lb-btn lb-close" type="button" aria-label="Zamknij" data-magnetic>
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <button class="lb-btn lb-prev" type="button" aria-label="Poprzednie zdjęcie">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="lb-btn lb-next" type="button" aria-label="Następne zdjęcie">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
        </button>
    </div>

    <script src="nav.js"></script>
    <script src="gallery.js"></script>
    <script src="fx.js"></script>
</body>

</html>
